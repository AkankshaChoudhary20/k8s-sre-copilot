# Seeded failure: container exits non-zero immediately -> CrashLoopBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-app
  namespace: default
  labels:
    app: crashloop-app
    sre-copilot-demo: "true"
    failure-mode: crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-app
  template:
    metadata:
      labels:
        app: crashloop-app
        sre-copilot-demo: "true"
        failure-mode: crashloop
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'simulating a startup crash' >&2; exit 1"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
